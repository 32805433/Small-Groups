fidelity:
  divergences: 'Displayed presentation slots may be redundant, and no minimality is claimed. The universal
    and torsion-free witnesses are separate. The manuscript conclusions are retained with the proof-method
    changes documented in FORMALIZATION.md: algebraic Hopf/Schur APIs, direct lifting through two
    mitoses, finite marked-picture factor injection, weighted identity balance, and a cyclic-module
    torsion obstruction. No comparison with Mathlib chain-complex homology or topological manifold
    result is claimed.'
review:
  status: unchecked
  notes: No independent mathematical review or manual review of the four formal statements is recorded.
    On 25 October 2026, the current relocated layout passed lake --wfail build (2,552 jobs, zero warnings
    or errors), followed by a fresh execution of all 277 AxiomAudit.lean checkpoints. All four public
    theorems reported exactly propext, Classical.choice, and Quot.sound. The independent statement
    challenge also built successfully with exactly four expected sorry warnings and no errors. No
    local Comparator run or additional kernel-replay result is recorded. See VERIFICATION.md for reproduction
    commands and validation scope.
  independent_mathematical_review: not claimed
  external_comparator: not recorded
  hosted_CI: configured; no hosted run claimed
  local_validation:
    date: '2026-10-25'
    proof_build: passed; zero warnings or errors
    axiom_audit: passed; all 277 checkpoints
    statement_challenge: passed; four expected sorry warnings
    comparator: not run locally; Palomar performs its own verification on submission
limitations:
- No local Comparator or additional kernel-replay result is recorded. A local Comparator run is optional
  preparation; Palomar performs its own Comparator verification on the exact submitted public commit.
- The four intentional sorry placeholders in SmallPresentationStatements.lean are comparison inputs;
  the proved library does not import that module.
- GitHub Actions is configured for the proof build, axiom audit, and challenge elaboration; no hosted
  run or Comparator verdict is recorded.
- The unpublished source manuscript is identified by filename, version, date, and SHA256; it is not
  included in this publication.
- The 601 proof-module inventory includes AxiomAudit.lean and excludes the independent statement challenge.
