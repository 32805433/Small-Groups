version: v0.4
project:
  name: SmallGroups
  description: 'Lean 4 proofs of four existence theorems: a two-generator, three-relator universal
    group with infinite cyclic abelianization and a displayed normal generator; an effective two-generator,
    four-relator family with undecidable triviality and universal nontrivial members; a torsion-free
    two-generator, four-relator group with undecidable word problem, infinite cyclic abelianization,
    and a displayed normal generator; and an effective two-generator, five-relator family with undecidable
    triviality whose members are all torsion-free.'
  authors:
  - Qiuyu Ren
  responsible_maintainers:
  - Qiuyu Ren
  license: MIT
