name = "small_groups"
version = "0.1.0"
keywords = ["math", "group-theory", "computability"]
defaultTargets = ["SmallPresentation", "AxiomAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "SmallPresentation"
globs = ["SmallPresentation", "SmallPresentation.+"]

[[lean_lib]]
name = "AxiomAudit"

[[lean_lib]]
name = "SmallPresentationStatements"
